chat_html = """
<!DOCTYPE html>
<html>
<head>
    <title>Chat - Abhradeep's Chatbot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: #000814;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(0, 229, 255, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.15) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 20s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #00e5ff;
            text-shadow: 0 0 8px #00e5ff;
            text-decoration: none;
            font-size: 14px;
            z-index: 3;
        }

        .back-link:hover { color: #39ff14; text-shadow: 0 0 8px #39ff14; }

        .chat-container {
            position: relative;
            z-index: 2;
            width: 480px;
            background: rgba(0, 10, 25, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid #00e5ff;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.4), 0 0 60px rgba(57, 255, 20, 0.1);
            overflow: hidden;
        }

        .chat-header {
            background: rgba(0, 8, 20, 0.9);
            color: #00e5ff;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff;
            border-bottom: 1px solid rgba(0, 229, 255, 0.3);
        }

        .chat-box {
            height: 430px;
            overflow-y: auto;
            padding: 18px;
        }

        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(57, 255, 20, 0.5);
            border-radius: 10px;
        }

        .msg {
            margin: 10px 0;
            padding: 11px 16px;
            border-radius: 18px;
            max-width: 75%;
            line-height: 1.4;
            font-size: 14.5px;
            animation: popIn 0.25s ease;
            word-wrap: break-word;
        }

        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .user-msg {
            background: rgba(0, 229, 255, 0.15);
            color: #00e5ff;
            text-shadow: 0 0 6px rgba(0, 229, 255, 0.6);
            margin-left: auto;
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-bottom-right-radius: 4px;
        }

        .ai-msg {
            background: rgba(57, 255, 20, 0.1);
            color: #39ff14;
            text-shadow: 0 0 6px rgba(57, 255, 20, 0.6);
            margin-right: auto;
            border: 1px solid rgba(57, 255, 20, 0.4);
            border-bottom-left-radius: 4px;
        }

        .typing { font-style: italic; opacity: 0.7; }

        .input-row {
            display: flex;
            border-top: 1px solid rgba(0, 229, 255, 0.3);
            padding: 12px;
            background: rgba(0, 8, 20, 0.9);
        }

        #userInput {
            flex: 1;
            padding: 11px 16px;
            border: 1px solid rgba(0, 229, 255, 0.5);
            border-radius: 22px;
            outline: none;
            font-size: 14px;
            background: rgba(0, 20, 40, 0.6);
            color: #00e5ff;
        }

        #userInput:focus { box-shadow: 0 0 10px rgba(0, 229, 255, 0.6); }
        #userInput::placeholder { color: rgba(0, 229, 255, 0.5); }

        #sendBtn {
            margin-left: 10px;
            padding: 11px 20px;
            background: linear-gradient(135deg, #00e5ff, #39ff14);
            color: #000814;
            border: none;
            border-radius: 22px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        #sendBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 229, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <a href="/" class="back-link">← Back to Home</a>

    <div class="chat-container">
        <div class="chat-header">⚡ Abhradeep ⚡</div>
        <div class="chat-box" id="chatBox">
            <div class="msg ai-msg">Hey! I'm Abhradeep 👋 19-year-old CSE student — ask me anything, or let's just chat!</div>
        </div>
        <div class="input-row">
            <input type="text" id="userInput" placeholder="Type your message..." />
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.className = 'msg ' + (sender === 'user' ? 'user-msg' : 'ai-msg');
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            appendMessage(text, 'user');
            userInput.value = '';

            const typingDiv = appendMessage('typing...', 'ai');
            typingDiv.classList.add('typing');

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text})
                });
                const data = await res.json();
                typingDiv.textContent = data.reply;
                typingDiv.classList.remove('typing');
            } catch (err) {
                typingDiv.textContent = 'Connection error. Please try again.';
                typingDiv.classList.remove('typing');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
"""

with open("templates/chat.html", "w") as f:
    f.write(chat_html)

print("chat.html (chatbot page) updated with Abhradeep persona greeting")
